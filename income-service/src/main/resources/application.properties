# ==============================================
#  Application Configuration
# ==============================================
spring.application.name=income-service

# ==============================================
#  Database Configuration
# ==============================================
spring.r2dbc.url=r2dbc:postgresql://localhost:5050/income-service
spring.r2dbc.username=akentech
spring.r2dbc.password=Bundes9898
spring.r2dbc.initialization-mode=always
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.continue-on-error=true

# ==============================================
#  Server Configuration
# ==============================================
server.port=8081
spring.profiles.active=prod
spring.main.banner-mode=off

# ==============================================
#  Transaction Management
# ==============================================
spring.transaction.default-timeout=60s
spring.transaction.rollback-on-commit-failure=true

# ==============================================
#  Kafka Configuration
# ==============================================
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=income-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.akentech.shared.models
spring.kafka.consumer.properties.spring.json.value.default.type=com.akentech.shared.models.Income
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.acks=all

# Kafka Topics
kafka.income.topic=income-processing-topic

# ==============================================
#  Logging Configuration
# ==============================================
logging.level.root=INFO
logging.level.io.r2dbc=DEBUG
logging.level.reactor.netty=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.org.springframework.transaction=TRACE
logging.level.com.akentech=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG

# ==============================================
#  Swagger (SpringDoc OpenAPI) Configuration
# ==============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================================
#  Monitoring and Observability (Loki, Micrometer)
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=income-service
management.tracing.sampling.probability=1.0
